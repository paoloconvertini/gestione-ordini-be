name: build-and-push-backend
on:
  push:
    tags:
      - 'v*'   # es: v5.2.1
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (skip tests se vuoi)
        run: mvn -B -DskipTests package

      - name: Extract version from tag
        id: vars
        run: |
          REF="${GITHUB_REF#refs/tags/}"        # v5.2.1
          VER="${REF#v}"                         # 5.2.1
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "minor=${VER%.*}" >> $GITHUB_OUTPUT # 5.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64 # ,linux/arm64 se ti serve
          push: true
          tags: |
            pconvertini/gestione-ordini-api:${{ steps.vars.outputs.version }}
            pconvertini/gestione-ordini-api:${{ steps.vars.outputs.minor }}
            pconvertini/gestione-ordini-api:latest
          cache-from: type=registry,ref=pconvertini/gestione-ordini-api:buildcache
          cache-to: type=registry,ref=pconvertini/gestione-ordini-api:buildcache,mode=max
